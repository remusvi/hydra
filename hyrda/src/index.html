<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Decomposer</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div id="workspace">

      <header id="ribbon">
        <div class="menu-dropdown">
          <button class="menu-btn">File</button>
          <div class="dropdown-content">
            <button id="menu-open">Load File... <span class="shortcut">Ctrl+O</span></button>
            <button id="menu-close">Close File</button>
            <div class="dropdown-divider"></div>
            <button id="menu-export">Export Session...</button>
            <div class="dropdown-divider"></div>
            <button id="menu-exit">Exit</button>
          </div>
        </div>

        <div class="menu-dropdown">
          <button class="menu-btn">Edit</button>
          <div class="dropdown-content">
            <button id="menu-copy-addr">Copy Address <span class="shortcut">Ctrl+C</span></button>
            <button id="menu-copy-hex">Copy Hex Dump</button>
            <div class="dropdown-divider"></div>
            <button id="menu-goto">Go to Address... <span class="shortcut">G</span></button>
            <button id="menu-find">Find... <span class="shortcut">Ctrl+F</span></button>
          </div>
        </div>

        <div class="menu-dropdown">
          <button class="menu-btn">View</button>
          <div class="dropdown-content">
            <button id="menu-toggle-sidebar">Toggle Sidebar</button>
            <button id="menu-toggle-console">Toggle Output Console</button>
            <div class="dropdown-divider"></div>
            <button id="menu-reset-layout">Reset Panel Layout</button>
          </div>
        </div>

        <div class="menu-dropdown">
          <button class="menu-btn">Search</button>
          <div class="dropdown-content">
            <button id="menu-search-sequence">Search Sequence...</button>
            <button id="menu-scan-headers">Scan Magic Headers</button>
          </div>
        </div>

        <div class="menu-dropdown">
          <button class="menu-btn">Analysis</button>
          <div class="dropdown-content">
            <button id="menu-run-analysis">Run Auto-Analysis</button>
            <button id="menu-redecompose">Re-decompose Chunks</button>
            <div class="dropdown-divider"></div>
            <button id="menu-verify-hash">Verify Hashes</button>
          </div>
        </div>

        <div class="menu-dropdown">
          <button class="menu-btn">Options</button>
          <div class="dropdown-content">
            <button id="menu-preferences">Preferences...</button>
            <button id="menu-chunk-size">Configure Buffer Size</button>
          </div>
        </div>

        <div class="menu-dropdown">
          <button class="menu-btn">Help</button>
          <div class="dropdown-content">
            <button id="menu-docs">Documentation</button>
            <button id="menu-shortcuts">Keyboard Shortcuts</button>
            <div class="dropdown-divider"></div>
            <button id="menu-about">About</button>
          </div>
        </div>

        <div class="ribbon-divider"></div>

        <button id="open-btn" class="action-btn">📁 Load File...</button>
        <div id="file-meta" class="file-meta-text">No file loaded</div>
      </header>

      <div id="dock">
        <aside id="sidebar" style="width: 240px;">
          <div class="panel-header">Chunks / Segments</div>
          <div id="segment-list" class="sidebar-content">
            <span class="empty-hint">Waiting for input...</span>
          </div>
        </aside>

        <div class="resize-handle vertical" id="sidebar-splitter"></div>

        <main id="main-view">
          <div class="panel-header">Hex & Byte Decomposition Viewer</div>
          <div class="table-container">
            <table id="chunk-table" class="hidden">
              <thead>
                <tr>
                  <th>Address (Offset)</th>
                  <th>Size</th>
                  <th>Data Preview (Hex Dump)</th>
                </tr>
              </thead>
              <tbody id="chunk-body"></tbody>
            </table>
          </div>
        </main>
      </div>

      <div class="resize-handle horizontal" id="console-splitter"></div>

      <div id="bottom-dock" style="height: 140px;">
        <div class="bottom-tabs">
          <button class="tab-btn active">Output Window</button>
          <button class="tab-btn">Analysis Log</button>
          <button class="tab-btn">Breakpoints</button>
        </div>
        <div id="output-console" class="console-content">
          <p class="log-info">[I] Decomposer Workspace Initialized (Resizable Edition)</p>
          <p class="log-info">[I] Ready for binary stream target...</p>
        </div>
      </div>

      <footer id="statusbar">
        <span id="status-text">Status: Idle</span>
        <span id="status-arch">ARCH: x86_64 / Raw Binary</span>
      </footer>
    </div>
  </body>
</html>
